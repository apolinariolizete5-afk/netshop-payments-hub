services:
  - type: web
    name: moza-empregos
    runtime: node
    plan: free
    region: frankfurt

    buildCommand: npm install && npm run build
    startCommand: node .output/server/index.mjs
    healthCheckPath: /health

    envVars:
      - key: NODE_VERSION
        value: "22"

      - key: NITRO_PRESET
        value: render-com

      - key: HOST
        value: "0.0.0.0"

      - key: VITE_SUPABASE_URL
        sync: false

      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false

      - key: VITE_SUPABASE_PROJECT_ID
        sync: false

      - key: SUPABASE_URL
        sync: false

      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false

      - key: LOVABLE_API_KEY
        sync: false

      - key: NETSHOP_API_KEY
        sync: false

      - key: NETSHOP_WEBHOOK_SECRET
        sync: false

      - key: NETSHOP_WALLET_ID_1
        sync: false

      - key: NETSHOP_WALLET_ID_2
        sync: false

      - key: GEMINI_API_KEY
        sync: false
