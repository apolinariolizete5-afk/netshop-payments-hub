services:
  - type: web
    name: moza-empregos
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install && npm run build
    startCommand: node .output/server/index.mjs
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Build the server for a plain Node host instead of the default edge target.
      - key: NITRO_PRESET
        value: node-server
      - key: PORT
        value: "10000"
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: VITE_SUPABASE_PROJECT_ID
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: LOVABLE_API_KEY
        sync: false
      - key: NETSHOP_API_KEY
        sync: false
      - key: NETSHOP_WEBHOOK_SECRET
        sync: false
      - key: NETSHOP_WALLET_ID_1
        sync: false
      - key: NETSHOP_WALLET_ID_2
        sync: false
      - key: GEMINI_API_KEY
        sync: false
